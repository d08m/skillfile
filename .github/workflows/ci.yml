name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # tools.json is only a source of truth if something enforces it.
      - run: npm run check-tools
      - run: npm test
      # Dogfood: this repo's own AGENTS.md must never go stale.
      - run: node bin/skillfile.js check
      # The site serves that same file as a worked example; the copy must match.
      - run: node scripts/sync-site.js --check
