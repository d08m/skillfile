<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The product turns on one thing: a hash of the repo. So the mark is a
       fingerprint read as bars, with the last bar green — the state you want. -->
  <rect width="32" height="32" rx="7" fill="#12141a"/>
  <rect x="7"  y="9"  width="3" height="14" rx="1.5" fill="#f2f1ec"/>
  <rect x="12" y="12" width="3" height="11" rx="1.5" fill="#f2f1ec"/>
  <rect x="17" y="7"  width="3" height="16" rx="1.5" fill="#f2f1ec"/>
  <rect x="22" y="14" width="3" height="9"  rx="1.5" fill="#3fbd8a"/>
</svg>
